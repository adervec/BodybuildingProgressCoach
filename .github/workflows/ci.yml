name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.x is the engines floor (node:sqlite); 24.x is the current line we run locally.
        node: ['22.x', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm workspaces: a single root `npm ci` installs server + client from the root lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (server + client)
        run: npm run typecheck

      - name: Test (client geometry unit tests)
        run: npm run test

      - name: Build (server tsc + client vite)
        run: npm run build

      # Publish the built SPA from one matrix leg so it can be downloaded / deployed.
      - name: Upload client build
        if: matrix.node == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist
          if-no-files-found: error
          retention-days: 7
