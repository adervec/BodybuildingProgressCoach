name: Deploy to GitHub Pages

# Publishes the browser-only build (VITE_STATIC=1): IndexedDB instead of the Express/SQLite server,
# hash routing because Pages has no SPA rewrite, and guides copied into the bundle. The self-hosted
# server build is unaffected — see the Dockerfile / docker-publish workflow for that one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer commit supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Build the static client
        run: npm run build -w client
        env:
          VITE_STATIC: '1'

      - name: Verify the bundle is really server-free
        # The server branch should be tree-shaken out (VITE_STATIC folds the constant). A surviving
        # /api/ call would be a silently broken page in production, so fail loudly instead.
        run: |
          fail=0
          for s in '/api/athletes' '/api/backup/export' '/api/media'; do
            if grep -qF "$s" client/dist/assets/*.js; then
              echo "::error::static bundle still calls $s — the local backend is not fully wired"
              fail=1
            fi
          done
          for f in index.html manifest.webmanifest sw.js guides/posing-guide.html guides/posing-guide-women.html; do
            if [ ! -f "client/dist/$f" ]; then echo "::error::missing from bundle: $f"; fail=1; fi
          done
          # Absolute asset paths break under the /<repo>/ subpath Pages serves from.
          if grep -qE '(src|href)="/[^/]' client/dist/index.html; then
            echo "::error::index.html has absolute asset paths; they will 404 under the Pages subpath"
            fail=1
          fi
          exit $fail

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
