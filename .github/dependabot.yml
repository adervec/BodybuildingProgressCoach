version: 2
updates:
  # npm — single root lockfile covers both workspaces (server + client).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ['*']

  # Keep the GitHub Actions pinned in the workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Keep the Docker base image patched.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
