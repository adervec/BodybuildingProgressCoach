<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- House standard 22. 'wasm-unsafe-eval' runs the self-hosted MediaPipe wasm; Google is for Drive
         sign-in only. vite.config.ts drops this tag on the dev server (its HMR preamble is inline). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://adervec.github.io https://accounts.google.com; style-src 'self' 'unsafe-inline' https://adervec.github.io https://accounts.google.com; font-src 'self' https://adervec.github.io; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://adervec.github.io https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; manifest-src 'self'; worker-src 'self' blob:; media-src 'self' blob: data:; form-action 'none'; base-uri 'none'; object-src 'none'" />
    <title>Living Sculpture — Progress Coach</title>
    <meta name="description" content="Honest, fair tracking of physique and posing progress from your photos and video." />
    <meta name="theme-color" content="#0c0b08" />
    <meta name="app-whatsnew" content="%BASE_URL%whatsnew.json" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Self-hosted fonts (SIL OFL 1.1) — no third-party requests. See public/fonts/. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- House font: Atkinson Hyperlegible by default for body text, reader-changeable on the
         Dashboard. Served from the maker's own site under SIL OFL 1.1 (adervec.github.io/fonts/OFL.txt). -->
    <script src="https://adervec.github.io/font.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- house standard: the signed-in Google picture in the top-right corner of every page (font.js) -->
    <app-account corner></app-account>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
